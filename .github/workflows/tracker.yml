name: Miraculous Tracker

on:
  schedule:
    # Cada 30 minutos (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: # permite lanzarlo a mano

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python tracker.py

      # Guarda datos.json en el repo para la próxima comparación
      - name: Commit datos.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          if git diff --staged --quiet; then
            echo "Sin cambios en datos.json"
          else
            git commit -m "chore: actualizar datos.json [skip ci]"
            git push
          fi
